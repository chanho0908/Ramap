<svg width="40" height="45" viewBox="0 0 40 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 마커 핀 바디 (호버 상태 - 밝은 빨간색) -->
  <g filter="url(#shadow)">
    <!-- 원형 상단 -->
    <circle cx="20" cy="18" r="16" fill="#FF6666" stroke="#FFFFFF" stroke-width="2"/>

    <!-- 하단 삼각형 -->
    <path d="M 20 34 L 12 22 L 28 22 Z" fill="#FF6666"/>

    <!-- 라면 이모지 -->
    <text x="20" y="23" font-size="18" text-anchor="middle" dominant-baseline="middle">🍜</text>
  </g>

  <!-- 그림자 필터 (호버 시 더 진하게) -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
